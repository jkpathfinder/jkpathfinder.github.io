# Site configuration. This file is *NOT* reloaded automatically by `jekyll serve`;
# restart the server after editing it.

# Basic Site Settings
locale                   : "en-US"
title                    : "Mingrui Ma"
title_separator          : "-"
name                     : &name "Mingrui Ma"
description              : &description "a second-year Ph.D. student in Industrial Engineering at the University of Illinois Urbana-Champaign (UIUC)"
url                      : "https://jkpathfinder.github.io" # the base hostname & protocol for your site
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "jkpathfinder/jkpathfinder.github.io"

# Site Author - shown in the sidebar. Blank fields are hidden;
# see _includes/author-profile.html for every supported field.
author:
  avatar           : "personal_ID_photo.jpg"   # in /images/
  name             : "Mingrui Ma"
  pronouns         : # example: "she/her"
  location         : "Champaign, USA"
  employer         : "University of Illinois Urbana-Champaign"
  uri              :
  email            : "mma36@illinois.edu"

  # Academic websites
  arxiv            :
  googlescholar    : "https://scholar.google.com/citations?user=UYycSq8AAAAJ"
  orcid            : "https://orcid.org/0000-0002-2073-6424"
  researchgate     :

  # Code / social media (username or URL, see author-profile.html)
  github           :
  linkedin         : "mingrui-ma-77226037b"   # username from www.linkedin.com/in/<username>
  twitter          :
  zhihu            :


# SEO / social sharing
google_site_verification :
bing_site_verification   :
twitter:
  username               :
og_image                 :  # default sharing image placed in /images/


# Analytics (Google Analytics 4): set tracking_id to "G-XXXXXXX" to enable.
analytics:
  google:
    tracking_id          :


# Visitor Map (home page) - self-hosted, see visitor-map-worker/README.md
#  Visits are counted on every page and shown on a world map on the home page.
#  The map is hidden on the live site while `endpoint` is empty.
visitor_map:
  endpoint               : "https://jkpathfinder-visitor-map.jkpathfinder.workers.dev"   # deployed worker
  track_local            : false # also count visits from localhost (local testing only)
  refresh                : 60    # seconds between live updates of the map
  max_points             : 300   # most recent locations drawn on the map


# Collections
#  Every list page (Publications, Patents, Academic Services, Honors) is rendered
#  directly from the front matter of its collection, so no per-item pages are built.
collections:
  publications:
    output: false
  patent:
    output: false
  reviewing:
    output: false
  honors:
    output: false


# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true


# Reading Files
include:
  - _pages
exclude:
  - .claude
  - .sass-cache
  - .jekyll-cache
  - assets/js/_main.js
  - assets/js/plugins
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - serve-local.ps1
  - vendor
  - visitor-map-worker
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed


# Outputting
permalink: /:categories/:title/
timezone: Asia/Shanghai
future: true   # show accepted papers whose publication date is still ahead


# Plugins (all supported by GitHub Pages)
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from


# HTML Compression - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
